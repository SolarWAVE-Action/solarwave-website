title: "SolarWAVE Action"
description: "Advancing distributed solar ownership rights through data analysis, education, and advocacy."

url: "https://solarwave-action.github.io"
baseurl: "/solarwave-website"

theme: minimal-mistakes-jekyll
minimal_mistakes_skin    : "air"  # "mint"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-gist

# mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

# Site Settings
locale                   : "en-US"
#rtl                      : # true, false (default) # turns direction of the page into right to left for RTL languages
title_separator          : "-"
subtitle                 : "We Advance Viable Energy"
#name                     : "Your Name"
#description              : "An amazing website."
repository               : # GitHub username/repo-name e.g. "mmistakes/minimal-mistakes"
teaser                   : "/assets/images/SolarWAVEActionLogoSmall.png"
logo                     : "/assets/images/SolarWAVEActionLogoSmall.png"
masthead_title           : " "  # for no title
breadcrumbs              : false  # (default)
words_per_minute         : 200
enable_copy_code_button  : false  # (default)
copyright                : # "copyright" name, defaults to site.title
copyright_url            : # "copyright" URL, defaults to site.url
reCaptcha:
  siteKey                :
  secret                 :

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # https://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style


# Outputting
permalink: /:categories/:title/
timezone: "PST"


# Pagination with jekyll-paginate
paginate: 5 # amount of posts to show
paginate_path: /page:num/

# Pagination with jekyll-paginate-v2
# See https://github.com/sverrirs/jekyll-paginate-v2/blob/master/README-GENERATOR.md#site-configuration
#   for configuration details
pagination:
  # Set enabled to true to use paginate v2
  # enabled: true
  debug: false
  collection: 'posts'
  per_page: 10
  permalink: '/page/:num/'
  title: ':title - page :num'
  limit: 0
  sort_field: 'date'
  sort_reverse: true
  category: 'posts'
  tag: ''
  locale: ''
  trail:
    before: 2
    after: 2

compress_html:
  clippings: all
  ignore:
    envs: development


# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: # true
      share: true
      related: true

atom_feed:
  hide: true

footer:
  links:
    - label: "About"
      url: "/about/"
    - label: "Research"
      url: "/research/"
    - label: "Get Involved"
      url: "/get-involved/"
    - label: "Contact"
      url: "/contact/"

# Footer content
footer_content: "© 2026 SolarWAVE Action | All Rights Reserved"

